# ============================================================
# Core Application Base Configuration
# This file provides default settings for the msc-core module
# Profile-specific overrides are defined in:
# - src/main/resources/application-dev.properties
# - src/main/resources/application-prod.properties
# - src/test/resources/application-test.properties
# ============================================================

# ============================================================
# Spring Configuration
# ============================================================
spring.application.name=msc-core
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true

# ============================================================
# Jackson Configuration
# ============================================================
spring.jackson.time-zone=America/Guayaquil
spring.jackson.locale=es_EC

# ============================================================
# Logging Configuration (Default)
# ============================================================
logging.level.root=INFO
logging.level.com.rtravez.msc=INFO
