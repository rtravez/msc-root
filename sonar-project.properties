# Authentication must be supplied by the CI environment, never committed.
# Example: mvn sonar:sonar -Dsonar.token="$SONAR_TOKEN"
sonar.projectKey=msc-root

# --- optional properties ---

# defaults to project key
sonar.projectName=msc-root
# defaults to 'not provided'
#sonar.projectVersion=1.0
 
# Analyze only production Java sources from the Maven modules.
sonar.sources=msc-client/src/main/java,msc-core/src/main/java,msc-dto/src/main/java,msc-service/src/main/java
 
# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/target/**,**/generated-sources/**,**/src/test/**
sonar.java.binaries=msc-client/target/classes,msc-core/target/classes,msc-dto/target/classes,msc-service/target/classes
sonar.scm.provider=git
#sonar.scm.disabled=true